[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-mllm-guard"
version = "0.2.0"
description = "Representation-space malicious prompt detection for multimodal language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=9.0",
]

[project.optional-dependencies]
mllm = [
  "accelerate",
  "qwen-vl-utils",
  "transformers",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
aegis = "AEGIS.cli:main"

[tool.setuptools.packages.find]
include = ["AEGIS*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  ".venv",
  "data",
  "models",
  "outputs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
