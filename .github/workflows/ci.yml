name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check AEGIS scripts tests
      - name: Unit tests
        run: python -m pytest
      - name: Smoke test
        run: python scripts/run_smoke_tests.py
