name: AEGIS deliverables

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r deliverables/pipeline/requirements.txt
      - run: python deliverables/ci/run_checks.py
