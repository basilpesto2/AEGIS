[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-mllm-guard"
version = "0.3.0"
description = "Self-hosted malicious-prompt guardrail for multimodal language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=9.0",
]

[project.optional-dependencies]
mllm = [
  "accelerate",
  "huggingface-hub",
  "qwen-vl-utils",
  "transformers",
]

[project.scripts]
aegis = "AEGIS.cli:main"

[tool.setuptools.packages.find]
include = ["AEGIS*"]
